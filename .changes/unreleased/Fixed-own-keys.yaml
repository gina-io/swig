kind: fixed
body: 'A key in the data, a template name or a block name that is also the name of an Object.prototype member is read as an own key. A for loop over a mapping that holds a key named hasOwnProperty, or over an object with no prototype, no longer fails with « obj.hasOwnProperty is not a function » in any flavor, and neither does a macro call, or an include with an object, when the context holds such a key or has no prototype; a native block named hasOwnProperty works through extends and {% parent %}. The memory loader no longer serves an inherited member as template source: an include of __proto__ or constructor fails as a missing template does, where native failed with « source.replace is not a function » and swig-jinja2 rendered [object Object]. Native groupBy groups the values constructor and __proto__, where it failed with « out[keyname].push is not a function », and swig-jinja2 groupby groups the values hasOwnProperty and __proto__, where it failed or split the __proto__ group in two. A key "__proto__" in the data stays an own key where a filter maps over an object, where swig-twig merge copies one, where a swig-jinja2 loop filter keeps a mapping item and in the copy that an include with an object makes; before, it set the new object''s prototype, so the key was lost and the fields of its value read as the object''s own. With the memory cache, a template that a custom loader names __proto__ is loaded once, not on every render.'
