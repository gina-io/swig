kind: fixed
body: 'swig-jinja2 and swig-django: `in` compares the items of a list with Python''s equality, as Jinja2 and Django do: `True in [1]`, `1 in [True]` and `0 in [False]` are true, lists and mappings compare item by item (`[1, 2] in [[1, 2]]`, `[] in [[]]`, `{"k": 1} in [{"k": True}]`), and a date equals a date of the same time; until 2.10.0 an item matched only the identical value. In swig-jinja2 the operands, and the elements of a list or mapping literal, also read their own value, where until 2.10.0 a variable or attribute that was missing or held None read as an empty string; a missing value equals None, as `x is none` reads it (Jinja2 tells the two apart). So `x in [none]` is now true when `x` is missing or holds None, `x in [""]` and `"" in [x]` are false for it, and a missing or None value tested against a string (`x in "abc"`), or a string tested against a missing or None container (`"" in x`), is false. `not in` is the negated test. The operand reads are in the compiled code: recompile precompiled templates to pick them up.'
