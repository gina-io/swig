kind: fixed
body: 'Parenthesized sub-expressions keep their grouping when a template compiles, in every flavor. Since 2.0.0-alpha.2 the emitted JavaScript dropped the parentheses, so {{ (1 + 2) * 3 }} rendered 7, {% if (x or y) and z %} took its branch with x true and z false, ("a" + "b")[1] rendered aundefined and {{ -(-x) }} failed to compile.'
