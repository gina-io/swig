kind: security
body: 'With the default memory cache, a page''s override of a block nested inside another block, an if or a for loop no longer shows on other pages that extend the same layout. Once the layout was in the compile cache (compiled, rendered or included on its own), or the middle template of a three-level chain had been rendered as a page, the first page that overrode such a block put its block into the cached layout, and every page compiled later that did not override that block rendered it until the cache was cleared: content written for one page, such as a block only administrators should see, showed on other pages. The leaked block rendered with the data of the page that showed it, not with the data of the page it came from, and the leak depended only on which templates the process compiled first, not on any value in the request. A parent taken from the compile cache is now copied before its blocks are remapped. The same shared parent made native {% parent %} in a middle template that was in the compile cache render that template''s block twice; it now renders it once. Every release has the leak, back to the original swig 1.4.2, and every native release the double render.'
