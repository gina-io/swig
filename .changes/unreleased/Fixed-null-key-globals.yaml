kind: fixed
body: 'A context key that holds null or undefined and is named like a standard JavaScript global or a name the compiled code uses no longer lets that global or name through, in native swig, swig-twig and swig-jinja2: with such a key, `{{ _output }}` rendered the output so far (`[[]`), `{{ Math }}`, `{{ JSON }}`, `{{ _utils }}` and `{{ _ctx }}` rendered `[object Object]`, `{{ Date }}` and `{{ Object }}` rendered the function''s source, and `{{ __l }}` inside a loop rendered the list looped over; each renders an empty string now, as in swig-django. `Math is none` (swig-jinja2), `Math is null` (swig-twig) and `Math is None` (swig-django) are true for such a key, where they were false. With no such key in the context, a global a template reads (`Math`, `JSON`, `Date`, `encodeURIComponent`) is read as before, also after a loop variable named `Math` or `JSON`. A key that holds null and is named like another global, such as `setTimeout`, still lets that global through.'
time: 2026-11-16T10:52:05.718944+00:00
