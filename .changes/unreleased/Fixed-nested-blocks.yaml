kind: fixed
body: 'Blocks nested in blocks follow one chain of definitions per block name, on the sync and async render paths, in all four flavors. In native swig `{% parent %}` in a block nested in an override renders the next definition of its name instead of nothing, on both paths (`<YC>` becomes `<YCI>`, as Jinja2 renders `super()`). On the sync path `{% parent %}` in an override of a nested block renders the next definition too (`<O[C]>` becomes `<O[CI]>`), a block rendered through `{% parent %}` keeps the overrides of the blocks nested in it, and a block in a for loop or a filter tag of the root, overridden with `{% parent %}`, renders the parent content. Four behaviours change. A block nested in any block of an extending template is now a definition of its name, even when the root has no block for the enclosing one, so a template with no `{% parent %}` in it can render differently (`<P>` becomes `<N>` in all four flavors, as Jinja2 and Django render it). A block that renders itself through a nested block or `{% parent %}` now fails with an error naming the block when the render reaches it, where it rendered a truncated output or overflowed the stack before; a condition that ends such a recursion still lets the async path render it, while the sync path, which expands blocks at compile time, fails. A native child block named `__proto__` no longer overrides on the sync path, as on the async path. A custom tag compiled inside a block on the sync path now receives, as `parents`, the farther definitions of that block (entries with `name` and `blocks`, no `tokens`) instead of the parent templates; outside a block it receives the parent templates as before. On the async path a block body no longer reads a variable that a custom tag declares around the block (`_ctx` still reaches it). Repeated block names, which the docs leave undefined, now render alike on the two paths in most shapes. A template precompiled by an earlier release keeps rendering as it did until it is compiled again.'
