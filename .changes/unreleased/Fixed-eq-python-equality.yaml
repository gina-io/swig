kind: fixed
body: 'swig-jinja2 and swig-django: `==` and `!=` compare as Python does, where until 2.10.0 they were JavaScript''s loose operators. A string never equals a number or a boolean: `page == 1` is false when `page` is the string "1", and so are `"" == 0`, `"1" == true` and `[1] == 1`. Lists and mappings compare item by item: `[1] == [1]`, `[true] == [1]` and `{"a": 1, "b": 2} == {"b": 2, "a": 1}` are true, where two equal lists were two objects and so unequal; a date equals a date of the same time. In swig-jinja2 a missing or None operand reads as Jinja2''s Undefined or as None instead of an empty string: `x == ""`, `x == 0` and `x == false` are false for a missing or None `x`, and `x == none` is false for a missing `x`, as in Jinja2, while `x is none` stays true for it. The comparison is in the compiled code: recompile precompiled templates to pick it up.'
