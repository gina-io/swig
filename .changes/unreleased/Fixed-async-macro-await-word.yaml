kind: fixed
body: 'On the async render path a macro whose compiled code holds the word `await` no longer throws « The macro … holds an {% include %}, {% import %}, {% from %} or {% block %}, which the async render path does not support inside a macro. » when it holds none of them, in native swig, swig-twig and swig-jinja2: the word in the macro''s text, in a string it writes, in a for loop, with, filter, apply or set block inside it, or as the name of a parameter, of a variable it reads, of a loop variable or of a `{% set %}` no longer counts, so in native swig `{% macro m() %}<i>await</i>{% endmacro %}[{{ m() }}]` renders `[<i>await</i>]` on both render paths, and in the three flavors `{% macro m(await) %}[{{ await }}]{% endmacro %}{{ m("X") }}` renders `[X]`, where they threw on the async path; a macro that holds a real include, import, from import or block, or a native tag registered with setTag whose compiled code awaits, still throws. A template compiled with `codegenMode: ''async''` by 2.12.3 keeps the error until it is compiled again. A native tag registered with setTag whose compiled code writes `await` on a line that also holds a quote outside its string literals before it and another after it (in a regular expression or a comment) is no longer seen as awaiting: in a for loop or a macro on the async render path the template then fails to compile with a SyntaxError, where 2.12.3 rendered the loop and threw the macro error when the macro was called.'
