kind: added
body: 'swig-jinja2: Jinja2''s `urlize` filter, which 2.11.0 rejected as an unknown filter. It turns the URLs and email addresses in a text into links by Jinja2 3.1.6''s rules: `http://`, `https://` and `www.` links, bare domains under com, net, int, edu, gov, org, info and mil, IPv4 and IPv6 hosts, and `mailto:` and plain email addresses; a leading `(` and a trailing `.`, `,` or `)` stay outside the link unless a `)` closes a `(` inside it (`(http://example.com).` keeps `(` and `).` outside, `http://example.com/foo_(bar)` keeps its `)`). It escapes the rest of the text, gives every link but an email link `rel="noopener"`, and its output is not escaped again. Its arguments are positional, in the order `urlize(trim_url_limit, nofollow, target, rel, extra_schemes)`: write `none` to leave one unset (`u|urlize(none, true)` adds `nofollow`); a keyword argument such as `target="_blank"` fails to compile. Where it differs from Jinja2: None gives an empty string; a double quote is written `&quot;` where Jinja2 writes `&#34;`, the same text on screen; and swig-jinja2 has no Markup type, so `urlize` escapes again a value that `escape`, `safe` or `forceescape` has already been through (`x|safe|urlize` escapes the HTML in x, which Jinja2 keeps as it is), and an `escape` after `urlize` escapes its links. A limit that is not an integer (`urlize("10")`) leaves the links uncut, and an extra scheme that is not a scheme prefix is ignored, where Jinja2 raises an error.'
