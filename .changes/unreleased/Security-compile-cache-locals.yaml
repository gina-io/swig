kind: security
body: 'With the default memory cache, or a custom cache object, the locals given in the options of render, compile or compileFile no longer reach other calls for the same file. compile cached one function per filename, and that function kept the locals of the call that created it: render(source, { filename, locals }) rendered the first call''s locals on every later call with that filename, compile and compileFile with locals returned that same function, and a later caller passing its own locals, through renderFile or an include of the file, got the first call''s locals under its own. An application that rendered per-user data this way, as the documented render example with a filename does, showed the first user''s data to every later user of that page. The cache now keeps a function without those locals, and each call binds its own. Two other changes follow: a {% set %} no longer carries over between calls of one function compiled with locals, and compileFile with locals now applies them to a template stored with register. Null-prototype options.locals, which the first call already rejected, are now rejected on every call. Every release has it, native back to the original swig 1.4.2 and each flavor since its first release, on the sync and the async render path, and through the deprecated compileFileAsync.'
