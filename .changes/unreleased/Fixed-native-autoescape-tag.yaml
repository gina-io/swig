kind: fixed
body: 'Native swig''s `{% autoescape %}` tag fails at compile when it has no argument, with "Expected true, false, "html" or "js" in autoescape tag on line N.", where it turned escaping off; a string other than "html" or "js", in either quote style, fails with the tag''s "Unexpected token" error, where the built-in `e` filter gave HTML escaping and a replaced `e` filter received the string; so a custom strategy that a replaced `e` filter handles, such as "css", now fails in the tag, while the `autoescape` option still passes any string to the `e` filter. Both refusals happen at compile, also in a part of a template that never renders (the top level of an extending template outside its blocks, a block the parent template does not define, the top level of an imported file), where such a template rendered on both render paths. The end of a nested region now restores the enclosing region instead of the template default: with autoescape off, `{% autoescape true %}{% autoescape false %}{{ v }}{% endautoescape %}{{ v }}{% endautoescape %}` renders `<i>&lt;i&gt;` for v = "<i>", where it rendered `<i><i>`.'
