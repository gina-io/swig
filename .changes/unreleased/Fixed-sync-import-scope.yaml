kind: fixed
body: 'On the sync render path, {% import %} and {% from %} rewrote the compiled code of the imported macros by name, and several templates broke on it. In native swig a macro named k failed to compile and one whose name holds a $ rendered nothing. In native swig, Twig and Jinja2 a macro named sa failed, as did a set target named like another macro of the same file and an import whose alias is the name of one of its macros; a parameter named like another macro of the file rendered that macro''s code instead of the argument, and one named like an import of the file rendered [object Object]; text or a string holding "_ctx." followed by such a name was changed; and an import inside the imported file whose alias equals the importer''s alias rendered nothing. In Twig and Jinja2 a {% from %} also bound swapped aliases (import foo as bar, bar as foo) to the wrong macros, its macros could not call a macro of their file that it did not name, and an importer variable or loop variable named like such a macro made the call fail. The imported file''s own imports and macros now run unrewritten in a scope of the import, so all of these render as on the async render path, where they already did. One behaviour change follows: an import inside the imported file is no longer reachable through the importer''s alias ({{ alias.inner.macro() }} renders nothing), as on the async render path; the imported macros still use it. The name rewrite dates back to the original swig in native, and to the first release of swig-twig (2.0.0-alpha.3) and of swig-jinja2 (2.5.0).'
