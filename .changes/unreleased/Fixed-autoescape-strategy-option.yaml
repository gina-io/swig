kind: fixed
body: 'The autoescape option of @rhinostone/swig now takes the name of an escape strategy, as documented: autoescape set to ''js'' gives JavaScript escaping and ''html'' HTML escaping. The option was written into the compiled template as code, so these values failed with ReferenceError: js is not defined, and an autoescape option built from untrusted input could run as code in the template. A value already wrapped in quotes keeps working, and a value holding a double quote or a line break is now rejected with an error. The Twig, Jinja2 and Django frontends already passed the option to the escape filter as a string.'
