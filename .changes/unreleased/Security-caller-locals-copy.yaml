kind: security
body: 'A render now works on a copy of the locals object the caller passes, made at its top. On an instance without default locals the template used that object itself as its context, so the names it set ({% set %}, macros, imports, loop variables, Django {% cycle %} state) landed in it: a later render given the same object read them, and two concurrent renders on the async render path given one object read each other''s; with a request-scoped helper in that object, such as one that reads the current user from AsyncLocalStorage, one user''s page showed another user''s data. A template rendered as part of the render, an include on either path, still shares its context, so an include''s sets still reach its includer. Three cases still write into the object they are given: a template rendered from inside another render of the same instance (a helper that renders a partial), an include given an object with `with … only`, and a dotted set such as {% set site.user = who %}, since the copy is shallow. The render reads the caller''s own enumerable properties once, at its top, as it already did on an instance with default locals: a getter runs once, and a value a Proxy only synthesizes, or a non-enumerable property, is not seen. With frozen locals a {% set %}, which was dropped, and a macro or an import, which failed, now work. The later-render case is in every release, native back to the original swig 1.4.2 and each flavor since its first release; the concurrent case since 2.2.0 in native and Twig, since 2.5.0 (its first release) in Jinja2 and since 2.9.4 in Django, the first release where a loop holding an include renders on the async render path.'
