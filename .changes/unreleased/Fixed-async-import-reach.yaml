kind: fixed
body: 'On the async render path (renderFile with a loader whose async flag is set, or compileFile with codegenMode ''async''), a call of an imported macro no longer puts every name the imported template bound back in place: since 2.9.6 each call set the macros, top-level sets and import aliases of that template in the importer''s context and took each out again, so a page making 2000 calls into a 20-macro import rendered about three times slower than on 2.9.5. A call now puts in place only the names the imported template''s macros can reach, which their compiled code records, followed through the macros, imports and from-imports that template bound; when a name leads to a value nothing recorded (a function from the locals, an object or an array), or a macro hands the context itself to other code or holds a {% with %}, every name is in place as before. That page now renders in about a fifth of its 2.9.7 time. One behaviour change follows: while the macro runs, code that comes into it from the importing side (a macro or an import alias passed as an argument, a macro of an importing template called back by name, the importer''s alias of another file) still sees the names the imported macros can reach, but no longer the others; for those it reads its own template''s names, and the sync render path never put them in place either. The same holds for {% from %} in Twig and Jinja2.'
