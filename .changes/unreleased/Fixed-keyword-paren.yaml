kind: fixed
body: 'The keywords and, or, not, in and not in now read as operators when ( follows them with no space, in all four flavors, as they already did before a space: {% if not(x) %}, a and(b), a or(b), 1 in(l) and 1 not in(l) mean what their spaced forms mean. In 2.9.8 native swig read a and(b) and a or(b) as a, and 1 in(l) as 1, with no error, and not(x) called a function named not, which is false for every x; swig-twig, swig-jinja2 and swig-django read not(x) the same way and failed to compile and(, or(, in( and not in( with « Unexpected token »; swig-jinja2 also failed on "a" if(c) else "b" and on else("b"). Names that only start with a keyword (index, order, notify, android) are unchanged, and so are object keys named and, or, not or in. Two changes in native swig: a function passed in the locals and named not, and or or can no longer be called by that name (not(1) negates 1, and and(1) or or(1) fails to compile with « Unexpected logic »), and a {% macro %} head that is not a name fails to compile with « Expected a macro name on line N. », including a macro named not, and or or, which 2.9.8 accepted, and {% macro !(a) %}, which defined a macro named a.'
