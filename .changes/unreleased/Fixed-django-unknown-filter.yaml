kind: fixed
body: 'swig-django: a filter name the instance does not hold is a compile error wherever it stands, as in Django (`Invalid filter "nosuch" on line 3 in file page.html.`). It used to compile, then throw `_filters.nosuch is not a function` at render, or pass unnoticed in a branch not taken. Three things change for a template or a setup that relied on that: a name in a branch not taken stops the compile, a filter registered with setFilter after the compile that uses it fails at that compile, and `{{ x|toString }}`, `{{ x|hasOwnProperty }}` and the like, which called the Object.prototype method, are rejected.'
