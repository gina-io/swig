kind: security
body: 'swig-jinja2 slice and batch no longer build an array from a huge number in the data. slice built one column per count, and batch padded the last row up to its size, so a large count or size from the data exhausted the heap and aborted the process; under a 256 MB heap a slice count of 1e7 or a batch size of 1e8 did so within a second. slice with more than 1,000,000 columns now returns an empty list, as for an infinite count, and a batch size above 1,000,000 leaves the last row unpadded; smaller counts and sizes are unchanged. Every swig-jinja2 release since 2.5.0 has both; reaching them takes an application that passes a number from the request into the filter.'
