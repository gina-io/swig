kind: fixed
body: 'In native swig a filter inside a `{% set %}`, `{% if %}`, `{% elseif %}`, `{% for %}`, `{% include %}` or `{% filter %}` argument now applies to its own operand, as it does in an output: `{% set y = arr[0]|upper %}` and `{% if arr[0]|length %}` over an empty list no longer throw a TypeError at render, and `{% set y = (x)|upper %}`, `{% for c in (x)|reverse %}`, `{% include name|default("p.html") %}` and `{% filter replace("a", x|upper) %}` compile again (they failed in 2.9.10; the last one worked in 1.6.0). `{% filter upper() %}` with empty parentheses works, which it never did, and a group in double parentheses no longer breaks a set or a for tag: `{% set y = ((x)) %}` and `{% for c in ((x)) %}` failed to compile in 2.9.10. One behaviour change: a filter after a call in an if test now applies to that call only, so `{% if z and f(x)|upper %}` with z = 0 is false, where 2.9.10 applied the filter to `z and f(x)` and took the branch. A prototype-chain name called in a filtered tag argument, as in `{% set r = __proto__(x)|upper %}` or `{% if constructor(x)|upper %}`, now fails at compile with the prototype-chain guard, as it does without the filter; 2.9.10 compiled both.'
