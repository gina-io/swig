kind: fixed
body: 'Native swig keeps text that is not a whole comment as text, as swig-twig, swig-jinja2 and swig-django do. Text that ends with the comment close rendered nothing: `a #}`, `#}` and `{# c #}#}` rendered an empty string, and `x {# c #} y #}` rendered `x `. An unclosed comment open such as `{# unclosed` rendered nothing too, and so did text that ends with a custom comment close (`x -->` with `cmtControls: [''<!--'', ''-->'']`). An error raised after such text named a line too low, since the line breaks of that text were not counted.'
