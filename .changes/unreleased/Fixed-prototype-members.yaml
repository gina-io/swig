kind: fixed
body: 'A key from the data that an object gets only from Object.prototype reads as missing in a subscript, in a call on a subscript and in the swig-jinja2 attribute reader of groupby, sum and attr: with foo {}, `{{ foo[k] }}` printed the source of the function for k = __defineGetter__ (native) or __lookupGetter__ (swig-jinja2), and now renders as a key foo does not hold. A key written in brackets in the template reads the same way: `{{ foo["hasOwnProperty"]("b") }}` printed true and now renders nothing, while the dotted form `{{ foo.hasOwnProperty("b") }}` reads as before. Own keys, the members of a class and the methods that String, Number and Array define still read; a method a string gets only from Object.prototype now reads as missing (`{{ s[k]() }}` with s "abc" printed abc for k = toLocaleString and now renders nothing), and a Proxy whose get trap answers every key now gives nothing for such a name, as a plain object does. For these names the check looks at the first 1000 objects of a prototype chain: a name that only an object further down holds reads as missing here and in native `in`, where it read before (a chain of 1001 objects whose last one holds toString). A native set target still writes such a key as an own key, and the bracket fragments a custom tag receives read the four Object.prototype accessor helpers (__defineGetter__, __defineSetter__, __lookupGetter__, __lookupSetter__) as missing, even when the object holds one as its own key.'
