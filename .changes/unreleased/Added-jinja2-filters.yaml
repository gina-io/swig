kind: added
body: 'swig-jinja2: Jinja2''s filters `string`, `items`, `attr`, `filesizeformat` and `forceescape`, which 2.11.0 rejected as unknown filters. `string` gives the text of a value, `items` the key and value pairs of a mapping (`{% for k, v in d|items %}`), `attr` an attribute of a value (`user|attr("name")`), `filesizeformat` a number of bytes as a human-readable size, reading its input as Python''s `float()` does (`1234567|filesizeformat` is `1.2 MB`, `"1_000"|filesizeformat` is `1.0 kB` and `1536|filesizeformat(true)` is `1.5 KiB`), and `forceescape` escapes a value even when it is already escaped (`"&amp;"|forceescape` is `&amp;amp;`). Where they differ from Jinja2: `string` and `forceescape` give an empty string for None, and the JavaScript text of a boolean, list or mapping (`true|string` is `true` and `[1, 2]|string` is `1,2`, where Jinja2 writes `True` and `[1, 2]`); `forceescape` writes a double quote as `&quot;` where Jinja2 writes `&#34;`, the same text on screen; `attr` reads a name as `value.name` does, so it also reads a key of a mapping and a JavaScript property such as the `length` of a string, where Jinja2 reads attributes only, and it gives an empty value for `__proto__`, `constructor` and `prototype`, which `value.name` rejects when the template compiles. Where Jinja2 raises an error, these filters give a value: `items` an empty list for a value that is not a mapping, `attr` an empty value for an undefined value or a name that is not a string, and `filesizeformat` its input unchanged (`"abc"|filesizeformat` is `abc`).'
