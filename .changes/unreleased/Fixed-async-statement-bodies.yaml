kind: fixed
body: 'On the async render path (renderFile(path, locals, cb) with a loader that sets loader.async, or a compile with codegenMode async), an {% include %}, {% import %}, {% from %} or {% block %} inside a for loop (its else or empty branch too), a with, a filter or apply tag, a set block or a Django spaceless block now renders as on the sync path, in all four flavors. Before, such a template failed to compile with "SyntaxError: missing ) after argument list" ({% from %} failed only when it ran, with "await is not defined"), since the async render path shipped in 2.2.0 (measured on 2.2.0, 2.9.2 and 2.9.3). The loop runs its items one after another, so the loop variables and loop.* keep their values. A macro whose body holds one of those tags is not supported on the async render path: calling it throws an error that names the macro and its template and says the async render path does not support those tags inside a macro, and a template that only defines it renders. The sync path and every other compiled template are unchanged.'
