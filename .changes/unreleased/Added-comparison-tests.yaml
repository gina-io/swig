kind: added
body: 'swig-jinja2: Jinja2''s comparison tests `eq`, `equalto`, `ne`, `lt`, `lessthan`, `le`, `gt`, `greaterthan` and `ge`, which 2.10.0 treated as unknown tests. Each test gives what the operator it names gives, bare, after `is not` and with a parenthesized argument: `x is eq 1` is `x == 1` and `count is lt 10` is `count < 10`, so `eq` and `ne` compare with Python''s equality, as `==` and `!=` do, and `"1" is eq 1` is false. Where Jinja2 raises because it cannot order the two values (a string and a number, a list and a number, None or a missing value), an ordering test gives what its operator gives. A test registered under one of these names with `setExtension(''_test_<name>'', fn)` before the template compiles runs in place of the operator. `"eq" is test` and `"==" is test` are true, as in Jinja2; the `escaped` test is not provided.'
