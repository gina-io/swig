kind: added
body: 'swig-jinja2: Jinja2''s comparison tests `eq`, `equalto`, `ne`, `lt`, `lessthan`, `le`, `gt`, `greaterthan` and `ge`, which 2.10.0 treated as unknown tests. Each test gives what the operator it names gives, bare, after `is not` and with a parenthesized argument: `x is eq 1` is `x == 1` and `count is lt 10` is `count < 10`, so `eq` and `ne` compare with Python''s equality, as `==` and `!=` do, and `"1" is eq 1` is false. An ordering test compares lists by their text, as `<` does (`[2] is lt [10]` is false), and where Jinja2 raises because it cannot order the two values (a string and a number, a list and a number, None or a missing value), it gives what its operator gives. Each test takes one argument: with none or with two it fails when it is reached, as in Jinja2, and a signed number after the name is not its argument (`x is gt -1` reads as `(x is gt) - 1`), so write `x is gt(-1)`. A test registered under one of these names with `setExtension(''_test_<name>'', fn)` before the template compiles runs in place of the operator, with any number of arguments. `"eq" is test` and `"==" is test` are true, as in Jinja2; the `escaped` test is not provided, and `x is in y` does not parse (write `x in y`).'
