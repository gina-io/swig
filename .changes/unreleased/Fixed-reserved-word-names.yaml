kind: fixed
body: 'In native swig, swig-twig and swig-jinja2 a variable named with a JavaScript reserved word, such as `{{ class }}`, `{{ super }}`, `{{ enum }}`, `{{ const }}` or `{{ import }}`, renders its value from the context on both render paths, where it failed to compile with a raw JavaScript SyntaxError; swig-django already rendered it. A macro named `__k` called inside a for loop renders in native swig and swig-jinja2 instead of throwing. A loop variable or a macro parameter named like a name the compiled code uses no longer hides that name: in swig-twig, `{% for _utils in [1] %}` around a range renders `[12]` where it threw « _utils.isArray is not a function », `{% for _ext in [1] %}` around `2 is even` renders `[Y]` where the test read false, and macro parameters named `_utils` or `_ext` behave the same way; in swig-jinja2, a macro parameter named `_ext` no longer makes `2 is even` false, and one named `Math` no longer makes `2 ** 3` render an empty string.'
