kind: fixed
body: 'swig-django: add gives an empty string for operands Python cannot add, as Django does: a string and a number, a list or a mapping with anything but a list, and two mappings. `{{ "a"|add:1 }}` printed a1, `{{ 1|add:"a" }}` 1a, `{{ x|add:1 }}` over a missing x 1, and two mappings [object Object][object Object]. Behaviour change for a template that used add to join a string and a number. Numbers, numeric strings, two strings and two lists add as before.'
