kind: fixed
body: 'Behaviour that changes with these fixes: in native swig, swig-twig and swig-jinja2 an include inside a macro sees a macro parameter whose name cannot be a variable of the compiled code, such as `document` or `_ext` (`{% macro m(document) %}[{% include "p.html" %}]{% endmacro %}{{ m("X") }}`, with p.html holding `{{ document }}`, renders `[X]` on the sync path, where it rendered `[]` (and `[object Object]` with a parameter named `_ext`)), while it still sees no other parameter; swig-jinja2 no longer reads a global for a loop item that is null or undefined (`{% for Math in xs %}[{{ Math }}]{% endfor %}` over `[undefined, null, 1]` renders `[][][1]`, as the other flavors do, where it rendered `[object Object]` for the first two); in all four flavors `{{ __k }}` inside a one-name loop reads the context, an empty string or the context''s `__k`, where it rendered the loop''s index; and in native swig, swig-twig and swig-jinja2 a dotted read whose first name is a context key without that member no longer falls back to the global of that name: with `Math` holding `{}`, `{{ Math.PI }}` renders an empty string where it rendered 3.141592653589793, and in swig-jinja2 `Math.PI == x` is false there, as in Jinja2 (`{{ Math.PI }}|{% if Math.PI == x %}Y{% else %}N{% endif %}` with `x` 3.141592653589793 renders `|N` where it rendered `3.141592653589793|Y`).'
