kind: fixed
body: 'Behaviour that changes with these fixes: in native swig, swig-twig and swig-jinja2 an include inside a macro, and a macro called inside it, see a macro parameter named like a standard JavaScript global, a name the compiled code uses or a member objects get from Object.prototype, such as `document`, `_ext`, `_parentTpl` or `toString` (`{% macro m(document) %}[{% include "p.html" %}]{% endmacro %}{{ m("X") }}`, with p.html holding `{{ document }}`, renders `[X]` on the sync path, where it rendered `[]` (and `[object Object]` with a parameter named `_ext`, and the function''s source with one named `toString`), and `{% macro inner() %}{{ document }}{% endmacro %}{% macro m(document) %}[{{ inner() }}]{% endmacro %}{{ m("X") }}` renders `[X]` on both render paths, where it rendered `[]`), while they still see no other parameter; in swig-jinja2 a default that reads a parameter of such a name, an earlier one, its own or a later one, reads that parameter (its argument or, when the call gives none, the value its own default gave it once that default has run, and an empty value otherwise) also when the context holds a key of the same name, as Jinja2 does: with a context key `process` holding `"CTX"`, `{% macro m(process, b=process) %}[{{ b }}]{% endmacro %}` renders `[X]` for `{{ m("X") }}` and `[]` for `{{ m() }}` on both render paths, where it rendered `[CTX]` for both, `{% macro m(process=process) %}[{{ process }}]{% endmacro %}{{ m() }}` renders `[]` and `{% macro m(a=process, process="D") %}[{{ a }}|{{ process }}]{% endmacro %}{{ m() }}` renders `[|D]`, where they rendered `[CTX]` and `[CTX|D]`, while with `zz` for `process` these templates still render the context''s key (`[CTX]`, `[CTX]`, `[CTX]` and `[CTX|D]`), where Jinja2 renders `[X]`, `[]`, `[]` and `[|D]`; in swig-jinja2 a macro called from such a default reads a parameter of such a name of the calling macro, its own or a later one, as empty, also when the context holds a key of that name: with the context key `process` holding `"CTX"`, `{% macro h() %}{{ process }}{% endmacro %}{% macro m(b=h(), process="D") %}[{{ b }}|{{ process }}]{% endmacro %}{{ m() }}` renders `[|D]` on both render paths, where it rendered `[CTX|D]`, as Jinja2 does; in native swig, swig-twig and swig-jinja2 a macro defined inside another macro and called after that macro has returned no longer sees a parameter of such a name of the macro that defined it, which it sees when called inside that macro, and reads the name as the rest of the template does: `{% macro outer(_ext) %}{% macro inner() %}[{{ _ext }}]{% endmacro %}{% endmacro %}{{ outer("X") }}{{ inner() }}` renders `[]` on both render paths, where it rendered `[X]`, while with `zz` for `_ext` it still renders `[X]` (Jinja2 raises an error for that call, as `inner` is local to `outer`); swig-jinja2 no longer reads a global for a loop item that is null or undefined (`{% for Math in xs %}[{{ Math }}]{% endfor %}` over `[undefined, null, 1]` renders `[][][1]`, as the other flavors do, where it rendered `[object Object]` for the first two); in all four flavors `{{ __k }}` inside a one-name loop reads the context, an empty string or the context''s `__k`, where it rendered the loop''s index; and in native swig, swig-twig and swig-jinja2 a dotted read whose first name is a context key without that member no longer falls back to the global of that name: with `Math` holding `{}`, `{{ Math.PI }}` renders an empty string where it rendered 3.141592653589793, and in swig-jinja2 `Math.PI == x` is false there, as in Jinja2 (`{{ Math.PI }}|{% if Math.PI == x %}Y{% else %}N{% endif %}` with `x` 3.141592653589793 renders `|N` where it rendered `3.141592653589793|Y`). A call reads its name as a plain variable read now does, in native swig, swig-twig and swig-jinja2 and on both render paths: with no context key of the name, `{{ toString() }}` renders an empty string where it rendered `[object Undefined]`, `{{ valueOf() }}` and `{{ hasOwnProperty("a") }}` render an empty string where they threw « Cannot convert undefined or null to object », and `{{ class() }}`, `{{ _output() }}` and `{{ _utils() }}` render an empty string where they failed to compile or threw, while a function under a `class` key is called where the template failed to compile, and one under a `toString` key is called as before; a context key that holds undefined counts as a key: with one named `encodeURIComponent`, `{{ encodeURIComponent("a b") }}` renders an empty string where it rendered `a%20b`, and in swig-jinja2, with one named `Math`, `Math == none` and `Math in [none]` are true and `Math != none` is false, the reverse of before; and a native tag registered with setTag gets the same reads in the compiled fragments it receives: a tag that outputs its argument renders an empty string for `toString` when the context has no such key, where it printed the function''s source, and renders the value of a `class` key, where the template failed to compile; for `f (1)`, a call written with a space before its parenthesis, such a tag receives a call that runs, where the template failed to compile with a SyntaxError. A method that a value gets only from Object.prototype reads as missing when the template calls it, in native swig, swig-twig and swig-jinja2 and on both render paths, as a call after a subscript (`{{ os[0].hasOwnProperty("a") }}`) already read it in 2.12.2 and 2.12.3: `{{ o.hasOwnProperty("a") }}` renders an empty string where it rendered `true`, `{% if o.hasOwnProperty("a") %}` no longer takes its branch, and `{{ o.toString() }}` with `o` a plain object, `{{ a.valueOf() }}` with `a` holding `[1, 2]` and `{{ s.toLocaleString() }}` with `s` holding `"1234.5"` render an empty string where they rendered `[object Object]`, `1,2` and `1234.5`, while the methods that numbers, strings and dates define themselves, such as a number''s `toString` or a Date''s `valueOf`, and a method of the object''s own class are called as before; to test for a key, write `"a" in o` in native swig and `o.a is defined` in swig-twig and swig-jinja2 (false there for a key that holds null), and to print the value, write `{{ o }}`.'
