kind: fixed
body: 'Behaviour that changes with these fixes: in native swig, swig-twig and swig-jinja2 an include inside a macro sees a macro parameter whose name cannot be a variable of the compiled code, such as `document` or `_ext` (`{% macro m(document) %}[{% include "p.html" %}]{% endmacro %}{{ m("X") }}`, with p.html holding `{{ document }}`, renders `[X]` on the sync path, where it rendered `[]` (and `[object Object]` with a parameter named `_ext`)), while it still sees no other parameter; swig-jinja2 no longer reads a global for a loop item that is null or undefined (`{% for Math in xs %}[{{ Math }}]{% endfor %}` over `[undefined, null, 1]` renders `[][][1]`, as the other flavors do, where it rendered `[object Object]` for the first two); in all four flavors `{{ __k }}` inside a one-name loop reads the context, an empty string or the context''s `__k`, where it rendered the loop''s index; and in native swig, swig-twig and swig-jinja2 a dotted read whose first name is a context key without that member no longer falls back to the global of that name: with `Math` holding `{}`, `{{ Math.PI }}` renders an empty string where it rendered 3.141592653589793, and in swig-jinja2 `Math.PI == x` is false there, as in Jinja2 (`{{ Math.PI }}|{% if Math.PI == x %}Y{% else %}N{% endif %}` with `x` 3.141592653589793 renders `|N` where it rendered `3.141592653589793|Y`). A call reads its name as a plain variable read now does, in native swig, swig-twig and swig-jinja2 and on both render paths: with no context key of the name, `{{ toString() }}` renders an empty string where it rendered `[object Undefined]`, `{{ valueOf() }}` and `{{ hasOwnProperty("a") }}` render an empty string where they threw « Cannot convert undefined or null to object », and `{{ class() }}`, `{{ _output() }}` and `{{ _utils() }}` render an empty string where they failed to compile or threw, while a function under a `class` key is called where the template failed to compile, and one under a `toString` key is called as before; a context key that holds undefined counts as a key: with one named `encodeURIComponent`, `{{ encodeURIComponent("a b") }}` renders an empty string where it rendered `a%20b`, and in swig-jinja2, with one named `Math`, `Math == none` and `Math in [none]` are true and `Math != none` is false, the reverse of before; and a native tag registered with setTag gets the same reads in the compiled fragments it receives: a tag that outputs its argument renders an empty string for `toString` when the context has no such key, where it printed the function''s source, and renders the value of a `class` key, where the template failed to compile.'
