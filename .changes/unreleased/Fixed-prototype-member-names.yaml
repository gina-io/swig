kind: fixed
body: 'A name an object gets only from Object.prototype reads as missing, bare or dotted, in all four flavors and on both render paths: `{{ toString }}`, `{{ valueOf }}`, `{{ hasOwnProperty }}`, `{{ isPrototypeOf }}`, `{{ toLocaleString }}`, `{{ __lookupGetter__ }}` and `{{ obj.toString }}` render an empty string, where native swig, swig-twig and swig-jinja2 printed the function''s source and swig-django called it (`[object Object]`, `false`, or an empty string for `__lookupGetter__`), and `{% if toString %}` no longer takes its branch, also after a loop over that name: `[{{ toString }}]{% for toString in xs %}{% endfor %}[{{ toString }}]` renders `[][]`, and `{% if valueOf %}` after a loop over `valueOf` is not taken. In native swig, swig-twig and swig-jinja2 a macro parameter of such a name reads its argument: `{% macro m(toString) %}[{{ toString }}]{% endmacro %}{{ m("X") }}` renders `[X]`, where it printed the function''s source, and `{{ toString() }}` in that macro calls the argument, where it rendered `[object Undefined]`. swig-django also reads as missing a function added to Object.prototype and a function a Proxy returns for such a name, instead of calling it. A key of that name the object holds itself, and a method of the object''s own class, read as before.'
