kind: fixed
body: 'swig-jinja2 reads true, false and none, each also capitalised, as Jinja2''s constants: x == none and x is sameas none read like x is none and x != none like x is not none, the tests true and false are added, and batch and slice no longer pad with none. In 2.9.8 True, False, None and none were variable names, which render "": {% if True %} and {% if x == True %} with x true took the else branch, x == none was true for x = 0 and for x = "", x != none was false for x = 0, x is sameas none was true for x = "", [1,2,3]|batch(2, none) and [1,2,3]|slice(2, none) padded the short row with "", x is true and x is false failed to compile (Unexpected token "true" after "is" / "is not"), and (x is true) and (x is false) were false whatever x held. A template that binds one of the six names (set, for, a macro name or parameter, with, an import alias, a from name or alias) now fails to compile with Cannot assign to the constant "<name>" in "<tag>" tag, as in Jinja2; a macro named none in an imported file makes the importing template fail as well. none still renders "" wherever a variable holding None does ({{ none }}, none ~ "x", none|upper), and x == none, like x is none, is also true for an undefined variable. A None that a filter returns reaches the next filter as null: {{ x|default(none)|upper }} now renders "[object Object]" where 2.9.8 rendered "" (Jinja2 renders NONE), as a None value from the locals already did in 2.9.8 ({{ items|first|upper }} with items [None]).'
