kind: fixed
body: 'In swig-twig, swig-jinja2 and swig-django a key named _ext, _utils or Math in the template context, from the locals or set by the template, no longer replaces the engine helpers that tests, ranges, slices, ** and // call. In 2.9.8 the emitted code read these names from the context first: in swig-jinja2 {% if x is string %} was false with the locals { _ext: { _test_string: 0 } }, l[1:] rendered nothing with { _utils: { slice: 0 } } and the render failed with { _utils: { slice: "text" } }, and 2 ** 3 and 7 // 2 rendered nothing with { Math: { pow: 0 } } and { Math: { floor: 0 } }; in swig-twig x is even was false with { _ext: { _test_even: 0 } } and 1..n gave no items with { _utils: { range: 0 } }; in swig-django l[1:] rendered nothing with { _utils: { slice: 0 } } and t with { _utils: "text" }. A function in the locals under _ext._test_<name> also answered an unknown test name in swig-jinja2 (x is frobnicate was true); an unknown test is now false whatever the locals hold. Names a template binds as loop variables or macro parameters behave as before.'
